# Test, then publish Ken's RoboLabs to GitHub Pages.
# Pages must be enabled with "GitHub Actions" as the source (Settings → Pages).
name: Test and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Engine and UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # The generated-Python export test executes real NumPy code.
      - name: Install NumPy for the export test
        run: python3 -m pip install --break-system-packages --quiet numpy
      - name: Run the full suite
        run: npm test

  deploy:
    name: Deploy
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish only the static site. tests/, node_modules/ and docs/ sources
      # are not part of the deployed artifact.
      # vendor/ must be listed here: index.html loads vendor/three.min.js, and
      # dropping it silently degrades the 3D viewport to the 2D SVG fallback.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html 404.html favicon.svg robots.txt sitemap.xml site.webmanifest assets engine vendor _site/
      # Guard: every locally-referenced asset must exist in the artifact, so a
      # missing directory fails the build instead of breaking the page in prod.
      - name: Verify every local asset is staged
        run: |
          missing=0
          for ref in $(grep -hoE '(src|href)="[^"]+"' index.html 404.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -vE '^(https?:|#|mailto:|data:|javascript:|\$)' \
            | sort -u); do
            if [ ! -e "_site/$ref" ]; then
              echo "::error::referenced asset missing from the deployed artifact: $ref"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All referenced assets are present in _site."
          # Premade URDF models are fetched at runtime, so check them explicitly.
          n=$(ls -1 _site/assets/robots/*.urdf 2>/dev/null | wc -l)
          if [ "$n" -lt 6 ]; then
            echo "::error::expected at least 6 premade URDF models in assets/robots, found $n"
            exit 1
          fi
          echo "Premade URDF models staged: $n."
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
