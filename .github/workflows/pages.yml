# Test, then publish Ken's RoboLabs to GitHub Pages.
# Pages must be enabled with "GitHub Actions" as the source (Settings → Pages).
name: Test and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Engine and UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      # The generated-Python export test executes real NumPy code.
      - name: Install NumPy for the export test
        run: python3 -m pip install --break-system-packages --quiet numpy
      - name: Run the full suite
        run: npm test

  deploy:
    name: Deploy
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish only the static site. tests/, node_modules/ and docs/ sources
      # are not part of the deployed artifact.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html 404.html favicon.svg robots.txt sitemap.xml site.webmanifest assets _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
